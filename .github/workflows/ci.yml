name: OpenGame checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source and contribution history without LFS media
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select checks for the changed boundary
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs
      - name: Require Squash merges for sanitized media history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GraphQL variables are passed through gh fields, not expanded by the shell.
          # shellcheck disable=SC2016
          gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $repo: String!) { repository(owner: $owner, name: $repo) { squashMergeAllowed mergeCommitAllowed rebaseMergeAllowed } }' \
            --jq '.data.repository | if .squashMergeAllowed == true and .mergeCommitAllowed == false and .rebaseMergeAllowed == false then "Squash-only merge policy confirmed" else error("Enable Squash merge only before accepting cleaned media PRs") end'
      - name: Check the final merge tree and media policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then unset BASE_SHA; fi
          npm run templates:check -- --final-tree
          npm run storage:check -- --final-tree
          node --test tests/repository-storage.test.ts tests/media-transfer.test.ts
          node --test tests/template-library.test.ts tests/ci-scope.test.mjs
      - name: Install scanner
        run: node .github/scripts/motion-scan.mjs install "$RUNNER_TEMP/scanner"
      - name: Scan tracked source without publication credentials
        run: node .github/scripts/motion-scan.mjs source . "$RUNNER_TEMP/source-scan.json" "$RUNNER_TEMP/scanner/gitleaks"
      - name: Check presentation documentation
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.documents != '[]'
        env:
          CHANGED_DOCS: ${{ steps.scope.outputs.documents }}
        run: node .github/scripts/ci-scope.mjs --check-docs
      - name: Check template publication and source scanning
        run: |
          node --test tests/publish-template-catalog.test.mjs
          node --test --test-skip-pattern="^the scanner opens the nested application" tests/release-scan.test.mjs
      - name: Install locked dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --no-audit --no-fund
      - name: Check source and Studio types
        if: steps.scope.outputs.full == 'true'
        run: |
          npm run check
          npm run design:test
          npm run models:test
          node --test tests/source-build-state.test.ts
          npm run typecheck:studio
          npm run typecheck:backend
      - name: Measure component adoption and detached styles
        if: steps.scope.outputs.full == 'true'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test tests/ui-metrics.test.ts
          args=()
          if [[ -n "$PR_HEAD" ]]; then
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
            args+=(--base "$(git rev-parse HEAD^1)")
          fi
          npm run design:metrics -- "${args[@]}"
          cat dist/ui-metrics/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UI metrics with source locations
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-metrics
          path: dist/ui-metrics/
          if-no-files-found: error
      - name: Check capture failure classification and bounded recovery
        if: steps.scope.outputs.full == 'true'
        run: node --test tests/capture-retry.test.ts
      - name: Check composition, discovery and install attribution
        if: steps.scope.outputs.full == 'true'
        run: node --test tests/composition-canvas.test.ts tests/short-form-discovery.test.ts tests/install-attribution-worker.test.ts

  platform-reliability:
    name: Workspace reliability (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENMOTION_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
      - name: Select checks for the changed boundary
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs
      - name: Install locked dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --no-audit --no-fund
      - name: Check ownership recovery, read verification and immutable snapshots
        if: steps.scope.outputs.full == 'true'
        run: node --experimental-strip-types --test tests/process-lock.test.ts tests/version-reads.test.ts tests/capture-retry.test.ts tests/hyperframes-startup.test.ts tests/command-lifecycle.test.ts tests/windows-install-recovery.test.ts

  studio:
    name: Studio regression (${{ matrix.shard }}/2)
    env:
      OPENMOTION_TELEMETRY: '0'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select checks for the changed boundary
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs
      - name: Install locked dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --no-audit --no-fund
      - name: Studio regression
        if: steps.scope.outputs.full == 'true'
        run: npm run test:studio -- --maxWorkers=2 --shard=${{ matrix.shard }}/2

  distribution:
    name: OpenGame regression (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'pull_request' && '["runtime"]' || '["runtime","rendering","transcript","export"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      OPENMOTION_TELEMETRY: '0'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
      HYPERFRAMES_FFMPEG_PATH: /usr/bin/ffmpeg
      HYPERFRAMES_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
      - name: Setup pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select checks for the changed boundary
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs
      - name: Identify optional LFS inputs
        id: media-key
        if: steps.scope.outputs.full == 'true'
        run: echo "trees=$(git rev-parse HEAD:docs/readme HEAD:library HEAD:examples | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - name: Cache optional LFS media
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: optional-lfs-${{ runner.os }}-${{ steps.media-key.outputs.trees }}
          restore-keys: optional-lfs-${{ runner.os }}-
      - name: Download regression media
        if: steps.scope.outputs.full == 'true'
        run: |
          git lfs pull --include="docs/readme/**,library/**,examples/**" --exclude=""
          npm run media:pull
      - name: Select rendering package cache version
        if: steps.scope.outputs.full == 'true'
        id: rendering-cache
        run: echo "version=${ImageVersion:-$(date -u +%G-W%V)}" >> "$GITHUB_OUTPUT"
      - name: Restore rendering package downloads
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/motion-rendering-apt/*.deb
          # Reuse packages across runs of the same runner image; refresh when the image changes.
          key: rendering-apt-ubuntu24.04-${{ runner.arch }}-zip-unzip-ffmpeg-fonts-noto-core-v2-${{ steps.rendering-cache.outputs.version }}
          restore-keys: |
            rendering-apt-ubuntu24.04-${{ runner.arch }}-zip-unzip-ffmpeg-fonts-noto-core-v2-
            rendering-apt-ubuntu24.04-${{ runner.arch }}-zip-unzip-ffmpeg-fonts-noto-core-
      - name: Install rendering test tools
        if: steps.scope.outputs.full == 'true'
        run: |
          # The hosted Ubuntu image provides Chrome; Ubuntu's chromium package pulls a desktop snap.
          "$HYPERFRAMES_BROWSER_PATH" --version
          missing=()
          for package in zip unzip ffmpeg fonts-noto-core; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != 'install ok installed' ]; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            mkdir -p "$RUNNER_TEMP/motion-rendering-apt/partial"
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
              -o "Dir::Cache::archives=$RUNNER_TEMP/motion-rendering-apt" -o APT::Keep-Downloaded-Packages=true)
            # Hosted runners already have package indexes. Refresh only if installation needs it.
            if ! sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
            fi
            du -sh "$RUNNER_TEMP/motion-rendering-apt/"*.deb
          fi
      - name: Install locked dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --no-audit --no-fund
      - name: Build regression inputs
        if: steps.scope.outputs.full == 'true'
        run: |
          npm run build:studio
          npm run build:tracking
      - name: Validate tracking
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: |
          node --test tests/design-system.test.ts
          node --experimental-strip-types --test tests/template-attribution.test.ts tests/tracking.test.ts tests/tracking-device.test.ts tests/studio-tracking.test.ts tests/mcp-tracking-host.test.ts tests/codex-session-tracking.test.ts tests/host-session-tracking.test.ts tests/strategy-tracking-enrichment.test.ts tests/monetization-attribution.test.ts
      - name: OpenGame runtime regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: |
          node --test \
            tests/onboarding-selection.test.ts tests/mcp-template-recommendations.test.ts tests/template-cards-ui.test.ts \
            tests/install.test.ts tests/native-runtime.test.ts tests/source-install.test.ts tests/source-update.test.ts \
            tests/bootstrap.test.ts tests/inline-onboarding.test.ts tests/inline-storyboard.test.ts \
            tests/onboarding-workspace.test.ts tests/source-marketplace.test.ts \
            tests/byok.test.ts tests/transcription.test.ts tests/transcription-transport.test.ts tests/generation-options.test.ts tests/asset-library.test.ts \
            tests/gateway.test.ts tests/provider-dns-cancellation.test.ts tests/capability-center.test.ts tests/mcp-onboarding.test.ts tests/media-use.test.ts tests/product-identity.test.ts \
            tests/provider-settings.test.ts tests/local-agents.test.ts tests/agent-runtimes.test.ts tests/super-agent-adapters.test.ts \
            tests/web-publish.test.ts tests/content-batch.test.ts tests/design-deploy.test.ts tests/e2e-deploy-game-chain.test.ts tests/mcp-http.test.ts \
            tests/wechat-minigame.test.ts tests/local-game-preview.test.ts tests/workspace-json-preview.test.ts \
            tests/performance-lifecycle.test.ts tests/triggers.test.ts tests/mcp-registry.test.ts tests/public-names.test.ts tests/mcp-runtime.test.ts \
            tests/mcp-upgrade.test.ts tests/preview.test.ts tests/editor-urls.test.ts tests/workspace-studio.test.ts tests/preview-fonts.test.ts \
            tests/studio-render-attempts.test.ts tests/sync.test.ts tests/phase1.test.ts tests/project-archive.test.ts tests/project-management.test.ts \
            tests/design-catalog.test.ts tests/design-mcp.test.ts tests/design-import-asset.test.ts tests/scenario-content.test.ts tests/scenario-runs.test.ts \
            tests/scenario-bundle.test.ts tests/font-catalog.test.ts tests/font-import.test.ts tests/font-specimen.test.ts tests/studio-fonts.test.ts \
            tests/webmcp.test.ts tests/preview-handoff.test.ts tests/adapters.test.ts tests/template-delivery.test.ts tests/library-install.test.mjs \
            tests/recreate-measure.test.ts tests/workflow.test.ts tests/catalog.test.ts tests/prism-templates.test.ts tests/fuzzy-search.test.ts \
            tests/inline-video.test.ts tests/extension-boundary.test.ts tests/connections.test.ts tests/readme-resources.test.ts \
            tests/motion-design-remix.test.ts tests/motion-package.test.ts tests/account-quota.test.ts tests/explore-preview.test.ts
      - name: Application diagnostics
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: node --test --test-skip-pattern="^CLI works without a running app" tests/diagnostics.test.ts
      - name: Super Agent regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        timeout-minutes: 2
        run: node --test tests/super-agent.test.ts
      - name: Related template preview browser regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: node --experimental-strip-types tests/related-template-preview-browser.mjs "$RUNNER_TEMP/related-template-preview"
      - name: Repository template runtime regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: node --test tests/repository-template-runtime.test.ts tests/hosted-template-catalog.test.ts tests/template-guide.test.ts tests/template-prompts.test.ts tests/integration-setup.test.ts
      - name: Workspace, wrapper and session regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        timeout-minutes: 10
        run: node --experimental-strip-types --test --test-concurrency=1 tests/spa-routes.test.ts tests/server.test.ts tests/projects.test.ts tests/sessions.test.ts tests/multi-project.test.ts tests/asset-naming.test.ts tests/history.test.ts
      - name: Built-in template playback and export regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'runtime'
        run: node --experimental-strip-types --test tests/decision-tree.test.ts
      - name: Validate Design Studio projects and comment previews
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'rendering'
        # Keep Chrome startup separate from the parallel installation and packaging tests.
        run: node --experimental-strip-types --test --test-concurrency=1 tests/browser.test.ts tests/design-projects.test.ts
      - name: Validate two-round inline rendering
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'rendering'
        run: node --experimental-strip-types --test --test-concurrency=1 tests/inline-video-runtime.test.ts
      - name: Transcript workflow browser regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'transcript'
        run: node tests/transcript-browser.mjs "$RUNNER_TEMP/transcript-workflow"
      - name: Brand Kit capture, package and showcase regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'transcript'
        run: |
          node --test tests/brand-catalog.test.ts tests/brand-cover.test.ts tests/brand-kits.test.ts
          node --test tests/brand-extraction.browser.test.ts tests/brand-showcase.browser.test.ts
      - name: Video review comments and annotation regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'export'
        timeout-minutes: 5
        run: |
          node --test tests/review-comments.test.ts
          node --test tests/review-comments-browser.ts
      - name: Platform export Studio and MCP end-to-end regression
        if: steps.scope.outputs.full == 'true' && matrix.suite == 'export'
        timeout-minutes: 10
        run: |
          node --test tests/platform-export.test.ts tests/caption-export.test.ts
          node tests/platform-export-browser.mjs "$RUNNER_TEMP/platform-export"

  # Keep the existing required check while every independent lane runs in parallel.
  standalone:
    if: ${{ always() }}
    needs: [checks, platform-reliability, studio, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation lane
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED_PLATFORM: ${{ github.event_name == 'pull_request' }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.VALIDATION_RESULTS);
          for (const job of ['checks', 'platform-reliability', 'studio', 'distribution']) {
            const result = results[job]?.result;
            const expected = job === 'platform-reliability' && process.env.ALLOW_SKIPPED_PLATFORM === 'true'
              ? 'skipped' : 'success';
            if (result !== expected) {
              console.error(`${job}: expected ${expected}, received ${result ?? 'missing'}`);
              process.exitCode = 1;
            }
          }
          NODE
